<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DiCyn Color">
<meta name="application-name" content="DiCyn Color">
<meta name="theme-color" content="#16181b">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head><body>
<title>DiCyn Color</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: editor de una pantalla. Teléfono: visor, bandeja de línea de tiempo (altura ajustable), pestañas y panel que se desplaza.
   Computadora horizontal: capas | visor | herramientas, bandeja abajo. Computadora con video vertical: capas | herramientas | visor de alto completo. */
:root{
  --bg:#0e0f11; --panel:#16181b; --raise:#1f2226; --raise2:#292d33; --line:#2b2f36; --line2:#3a3f48;
  --fg:#eceae5; --muted:#8f949d; --accent:#f2a03d; --accent-ink:#1b1205; --danger:#ff6b5e; --ok:#58d39a;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --vh:clamp(160px,33svh,420px); --trayh:150px; --labw:52px; --vcol:420px;
  color-scheme:dark;
}
*{box-sizing:border-box;touch-action:manipulation}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
#ov,#trk,.grip{touch-action:none}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{height:100%;display:grid;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto var(--vh) var(--trayh) auto minmax(0,1fr);
  grid-template-areas:"top" "viewer" "tray" "tabs" "body"}
.shell.portrait{--vh:clamp(200px,42svh,560px)}
.top{grid-area:top;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis}
.brand i{display:inline-grid;grid-template-columns:repeat(3,5px);gap:2px;flex:none}
.brand i b{height:13px;border-radius:2px}
.meta{font-family:var(--display);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:7px 11px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:13.5px}
.btn:hover{border-color:var(--line2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.btn.sm svg{width:14px;height:14px}
.btn.wide{width:100%}

.viewer{grid-area:viewer;display:flex;flex-direction:column;min-height:0;min-width:0;background:#08090a}
.vwrap{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:8px}
.stage{position:relative;background:#000;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none;cursor:crosshair}
.badge{position:absolute;left:8px;top:8px;font-family:var(--display);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.62);color:#fff;padding:3px 7px;border-radius:4px;pointer-events:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.vbtn{border:0;background:rgba(0,0,0,.62);color:#fff;border-radius:6px;padding:5px 8px;font-size:12px;font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.vbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.transport{display:flex;align-items:center;gap:10px;padding:2px 12px 8px;min-width:0}
.play{width:36px;height:36px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:14px;height:14px}
.tc{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;letter-spacing:.03em;white-space:nowrap}
.tc span{color:var(--muted);font-weight:500}
.trimtag{margin-left:auto;font-family:var(--display);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* bandeja */
.tray{grid-area:tray;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.grip{height:14px;flex:none;cursor:ns-resize;display:grid;place-items:center;touch-action:none}
.grip::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line2)}
.trayhead{display:flex;align-items:center;gap:6px;padding:0 10px 6px;overflow-x:auto;flex:none;scrollbar-width:none}
.trayhead::-webkit-scrollbar{display:none}
.trayhead .sp{flex:1}
.trk{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 0 8px;touch-action:pan-y}
.trow{display:grid;grid-template-columns:var(--labw) minmax(0,1fr);align-items:center;gap:0;height:30px;padding-right:12px}
.trow.video{height:48px}
.tlab{display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;min-width:0;font-size:12px;font-weight:600;height:100%}
.tlab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tlab .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tlab .x{width:22px;height:22px;border:0;background:none;color:var(--muted);border-radius:5px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.tlab .x:hover{background:var(--line);color:var(--danger)}
.tlab .x svg{width:14px;height:14px}
.tbar{position:relative;height:22px;border-radius:6px;cursor:pointer;overflow:hidden;background:#1d2024}
.trow.video .tbar{height:44px}
.tbar canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.trow[aria-current="true"] .tlab{color:var(--fg)}
.trow[aria-current="true"] .tbar{box-shadow:0 0 0 1.5px var(--lc)}
.trow.off .tbar,.trow.off .tlab .nm{opacity:.4}
.ph{position:absolute;left:0;top:0;bottom:0;will-change:transform;width:2px;margin-left:-1px;background:#fff;pointer-events:none;z-index:2;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.ph::before{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:#fff}

.tabs{grid-area:tabs;display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:none;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab svg{width:19px;height:19px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

.capas,.body{grid-area:body;overflow-y:auto;overscroll-behavior:contain;min-height:0;min-width:0;padding:12px 14px calc(24px + env(safe-area-inset-bottom,0px))}
.shell:not([data-tab="capas"]) .capas{display:none}
.shell[data-tab="capas"] .body{display:none}

.lbl{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:12.5px;line-height:1.45;margin:0}
.hint strong{color:var(--fg);font-weight:600}
.stack{display:grid;gap:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.status b{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.status.ok b{background:var(--ok)}

.lyr{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;padding:8px 8px 8px 10px;border-radius:10px;border:1px solid transparent;background:var(--raise);cursor:pointer}
.lyr[aria-current="true"]{border-color:var(--lc,var(--fg));background:var(--raise2)}
.lyr .dot{width:12px;height:12px;border-radius:50%}
.lyr .nm{min-width:0}
.lyr .nm b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr .nm small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.lyr.off .nm,.lyr.off .dot{opacity:.45}
.ib{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.ib:hover{background:var(--line);color:var(--fg)}
.ib svg{width:17px;height:17px}

.target{display:flex;align-items:center;gap:8px;font-weight:600}
.target .dot{width:12px;height:12px;border-radius:50%}
.sec{display:grid;gap:10px;padding-top:14px;margin-top:4px;border-top:1px solid var(--line)}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.link{background:none;border:0;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:2px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 50px;align-items:center;gap:10px}
.row label{font-size:13px}
.row input[type=range]{width:100%;min-width:0;margin:0;accent-color:var(--lc,var(--accent));height:24px}
.row output{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);text-align:right}
.tog{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--lc,var(--accent));flex:none}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.pre{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:0 0 6px;cursor:pointer;font-size:12px;font-weight:600;overflow:hidden;display:grid;gap:5px;text-align:center}
.pre i{display:block;height:28px}
.pre:hover{border-color:var(--line2)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.sw input{opacity:0;width:100%;height:100%;cursor:pointer}
.swc{position:relative;background:conic-gradient(#f44,#fd4,#4f6,#4df,#46f,#f4d,#f44)}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.txt,.sel{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--fg);font:inherit;font-size:16px;min-width:0;width:100%}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:8px 4px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--lc,var(--accent));background:var(--raise2)}

.bands{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.band{height:32px;border-radius:9px;border:2px solid transparent;padding:3px;background:var(--raise);cursor:pointer;position:relative}
.band i{display:block;height:100%;border-radius:6px}
.band[aria-pressed="true"]{border-color:var(--fg)}
.band.edited::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}
.row.hue input[type=range]{-webkit-appearance:none;appearance:none;height:10px;border-radius:6px;background:linear-gradient(90deg,hsl(0 75% 55%),hsl(60 75% 55%),hsl(120 75% 50%),hsl(180 75% 50%),hsl(240 75% 60%),hsl(300 75% 58%),hsl(360 75% 55%))}
.row.hue input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #111}
.row.hue input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid #111}
.brushbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:6px;background:rgba(14,15,17,.92);border:1px solid var(--line);border-radius:10px;padding:6px 8px;max-width:calc(100% - 16px);flex-wrap:wrap;justify-content:center}
.brushbar span{font-weight:600;font-size:12.5px;padding:0 4px}
.brushbar input{width:90px;accent-color:var(--accent)}
.partmenu{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:7;width:min(380px,calc(100% - 16px));max-height:calc(100% - 20px);overflow:auto;background:rgba(22,24,27,.97);border:1px solid var(--line2);border-radius:12px;padding:12px;display:grid;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.pm-head{display:flex;align-items:center;gap:8px}
.pm-head b{font-family:var(--display);font-size:15px}
.pm-head span{color:var(--muted);font-size:12.5px;flex:1}
.pm-ex{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip .dot{width:9px;height:9px;border-radius:50%}
.parts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.parts button{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:9px 6px;font-size:13px;font-weight:600;cursor:pointer}
.parts button:hover{border-color:var(--line2)}
.parts button[aria-pressed="true"]{border-color:var(--lc,var(--accent));background:var(--raise2)}
.parts button:disabled{opacity:.4;cursor:not-allowed}
a.btn{text-decoration:none;color:inherit}
.sheet,.tools,.rail{display:none}
.tht{display:flex;align-items:center;gap:10px;min-width:0}
.tht:empty{display:none}
.thb{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.trow.ruler{height:16px}
.trow.ruler .tbar{height:16px;background:none;cursor:pointer;border-radius:0}
.upd{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:14px;transition:opacity .4s ease}
.upd.out{opacity:0}
.upd-logo{display:flex;gap:9px;align-items:center;height:96px}
.upd-logo b{width:22px;height:84px;border-radius:7px;animation:eq 1s ease-in-out infinite;transform-origin:center}
.upd-logo b:nth-child(1){background:#e8574b}
.upd-logo b:nth-child(2){background:#5fc06a;animation-delay:.15s}
.upd-logo b:nth-child(3){background:#4b8ef0;animation-delay:.3s}
@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.upd-name{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em}
.upd-txt{color:var(--muted);font-size:14px}
.upd-bar{width:180px;height:4px;border-radius:2px;background:var(--raise);overflow:hidden}
.upd-bar i{display:block;width:40%;height:100%;border-radius:2px;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.upd-ver{font-family:var(--display);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,6,8,.72);display:grid;place-items:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(400px,100%);display:grid;gap:12px}
.card h2{font-family:var(--display);font-size:18px;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.45}
.bar{height:8px;border-radius:4px;background:var(--raise);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--raise)}
.opt:has(input:checked){border-color:var(--accent);background:var(--raise2)}
.opt input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.opt b{font-weight:600}
.opt small{color:var(--muted);font-family:var(--display);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--raise2);border:1px solid var(--line);padding:10px 14px;border-radius:8px;max-width:calc(100% - 32px);font-size:13px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.4)}

@media (max-width:899px){.partmenu{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:70vh;z-index:15}.trow:not(.video) .tlab .nm{display:none}.trow.video{height:40px}.trow.video .tbar{height:36px}.tlab{padding:0 4px 0 8px;gap:4px}.trow.video .tlab .nm{font-size:11px}}
@media (max-width:480px){.brand{font-size:14px}.top .btn{padding:7px 9px}.meta{display:none}}
@media (max-width:899px){.shell.portrait .badge{display:none}
  :root{--trayh:224px}
  .shell{grid-template-rows:auto minmax(0,1fr) var(--trayh) auto;grid-template-areas:"top" "viewer" "tray" "tools"}
  .shell.sheet-open .tray{display:none}
  .shell.sheet-open .sheet{display:flex}
  .tabs,.shell>.capas,.shell>.body{display:none!important}
  .sheet{grid-area:tray;display:none;flex-direction:column;min-height:0;overflow:hidden;background:var(--panel);border-top:1px solid var(--line)}
  .sheethead{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);flex:none}
  .sheethead .play{width:30px;height:30px}
  .sheethead .play svg{width:12px;height:12px}
  .sheethead .tc{font-size:12.5px}
  .sheethead b{flex:1;text-align:center;font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .sheetbody .capas,.sheetbody .body{padding:10px 14px 14px!important}
  .sheetbody .stack{gap:10px}
  .sheetbody .sec{gap:8px;padding-top:10px}
  .sheetbody .row{grid-template-columns:86px minmax(0,1fr) 44px;gap:8px}
  .sheetbody .row label{font-size:12.5px}
  .sheetbody .presets{display:flex;overflow-x:auto;gap:8px;scrollbar-width:none;margin:0 -14px;padding:0 14px}
  .sheetbody .presets::-webkit-scrollbar{display:none}
  .sheetbody .pre{flex:none;width:72px}
  .sheetbody .hint{font-size:12px}
  .sheetbody{position:relative;flex:1;min-height:0}
  .sheetbody .capas,.sheetbody .body{position:absolute;inset:0;overflow-y:auto;padding:12px 16px 16px}
  .shell[data-tab="capas"] .sheetbody .body,.shell:not([data-tab="capas"]) .sheetbody .capas{display:none}
  .tools{grid-area:tools;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tool{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;font-size:11.5px;font-weight:600;cursor:pointer}
  .tool svg{width:21px;height:21px}
  .tool[aria-pressed="true"]{color:var(--accent)}
  .rail{display:flex;position:absolute;z-index:4;gap:6px}
  .shell.portrait .rail{right:6px;top:50%;transform:translateY(-50%);flex-direction:column}
  .shell:not(.portrait) .rail{left:50%;bottom:4px;transform:translateX(-50%);flex-direction:row}

    if (!started) { rec.start(500); started = true; } else rec.resume();
    await new Promise(r => { expWatch = { b: c.b, a: c.a, base: doneLen, total, r }; video.addEventListener('ended', r, { once: true }); video.play().catch(() => r()); });
    expWatch = null; video.pause(); rec.pause(); doneLen += c.b - c.a;
  }
  if (started) { rec.resume(); rec.stop(); await stopped; }
  stream.getVideoTracks().forEach(t => t.stop());
  if (S.cancel || !started) return null;
  return { blob: new Blob(chunks, { type: mime.split(';')[0] }), ext: mime.includes('mp4') ? 'mp4' : 'webm' };
}

async function checkUpdate() {
  if (window.claude || location.protocol !== 'https:' || updTried) return;

  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const j = await r.json(); if (!j.v || j.v === APP_VERSION) return;
    let tried = null; try { tried = sessionStorage.getItem('dc-upd-try'); } catch (e) {}
    if (tried === j.v) return;
    updTried = true;
    try { sessionStorage.setItem('dc-upd-try', j.v); sessionStorage.setItem('dc-upd', j.v); } catch (e) {}
    showUpdating(j.v);
    const t0 = Date.now();
    try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (e) {}
    await sleep(Math.max(0, 1600 - (Date.now() - t0)));
    location.reload();
  } catch (e) {}
}
setTimeout(checkUpdate, 2500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { updTried = false; checkUpdate(); } });
